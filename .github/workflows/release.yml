name: Release

# Thin caller: delegates tag + GitHub Release (LLM-themed notes) + Discord notice to
# the reusable plugin-release workflow in protoLabsAI/release-tools. Fires on a
# `chore: release vX.Y.Z` commit landing on main, or manually via workflow_dispatch.
# The reusable workflow is idempotent: a re-run on an existing tag skips gracefully.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The reusable workflow creates the tag + GitHub Release; a called workflow can only
# narrow the caller's GITHUB_TOKEN, so write access is granted here.
permissions:
  contents: write

jobs:
  release:
    if: >-
      github.repository == 'protoLabsAI/protobanana-plugin' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'chore: release v'))
    uses: protoLabsAI/release-tools/.github/workflows/plugin-release.yml@v2
    # inherit, not a named list: plugin-release.yml uses DISCORD_RELEASE_WEBHOOK,
    # GATEWAY_API_KEY and GH_PAT without declaring them under workflow_call.secrets,
    # and GitHub only allows passing secrets by name when the callee declares them.
    secrets: inherit
