id: protobanana
name: protoBanana Images
version: 0.6.0
min_protoagent_version: 0.223.0
description: >-
  Native image generation and editing via the protoBanana gateway (self-hosted
  ComfyUI workflows behind LiteLLM): text-to-image, instruction edits,
  region edits, background removal, multi-image composition, and outpainting. Results land in the core media store, render inline in chat,
  and — on a vision model — are attached so the agent can see what it made.
repository: https://github.com/protoLabsAI/protobanana-plugin

# All traffic rides graph.sdk.gateway_client() (#1931) — the configured model
# gateway api_base with bearer auth and the WAF-allowlisted UA. No other host
# is ever contacted (the api_base host is egress-trusted per ADR 0008; image
# backends are reached only THROUGH the gateway, never directly).
capabilities:
  network: []
  filesystem: scoped   # reads back prior results from the core media store; writes only via registry.save_media

# protoBanana Studio — a console view (ADR 0026/0038): the page is public, the
# data routes are gated. The plugin serves both from its FastAPI router; the
# built Vite app is committed under view/dist/ so git installs need no Node.
views:
  - id: studio
    label: Studio
    icon: Wand2
    placement: rail
    path: /plugins/protobanana/studio

# The public page prefix (page + its built assets). Everything under
# /api/plugins/protobanana stays gated by default (ADR 0026 D1/D5).
public_paths:
  - /plugins/protobanana/studio

# Completion events for the Studio view (and other consumers) on the core event
# bus (ADR 0039). Renders submitted from the view are jobs; the view subscribes
# through the plugin kit, keeping it off the 20 s fleet read lane.
emits:
  - protobanana.job.done
  - protobanana.job.failed

# Pillow (not declared in requires_pip — the frozen desktop runtime refuses
# plugins with non-bundled pip deps, protoAgent#1631). It is a hard dependency
# of protoAgent core since v0.190.0 and bundled in the desktop app, and the
# plugin imports it lazily: it flattens transparent inputs onto white before an
# edit (ComfyUI's LoadImage drops alpha → black), restores the transparency /
# input size afterwards, de-fringes remove_background cutouts, and shrinks
# oversized two-ref person refs under the gateway's 1MB form-part cap. On an
# older host without it, those steps are skipped (the tools still work).

config_section: protobanana
config:
  gen_model: protolabs/qwen-image
  fast_gen_model: protolabs/qwen-image-2-1-turbo
  inpaint_model: protolabs/qwen-image-inpaint
  edit_model: protolabs/qwen-image-edit
  fast_edit_model: protolabs/qwen-image-edit-turbo
  compose_model: protolabs/qwen-image-multiref  # compose rides chat completions (edits is single-image by spec)
  bgremove_model: protolabs/qwen-image-bgremove
  region_model: protolabs/qwen-image-region-edit
  outpaint_model: protolabs/qwen-image-outpaint
  default_size: 1024x1024
  catalog_timeout_s: 5
  catalog_ttl_s: 60
  timeout_s: 300
  show_model: true     # attach results via multimodal_tool_result (#1930) so a vision model sees them
  studio_retry_on_524: false   # off by default: a 524 means the ComfyUI job is still running, so an auto-retry would stack a second GPU job (protoBanana#52)
  studio_retry_backoff_s: 2    # seconds to wait before the single retry (only when studio_retry_on_524 is true)

settings:
  - { key: inpaint_model, label: "Inpaint model", type: string, description: "Gateway alias for alpha-mask inpainting." }
  - { key: gen_model, label: "Text-to-image model", type: string, description: "Gateway alias for /images/generations (must exist in the gateway's model_list)." }
  - { key: fast_gen_model, label: "Draft (fast) model", type: string, description: "Alias used when generate_image is called with draft=true — a distilled few-step variant." }
  - { key: fast_edit_model, label: "Draft (fast) edit model", type: string, description: "Alias used when edit_image is called with draft=true — the distilled Turbo editor." }
  - { key: edit_model, label: "Edit model", type: string, description: "Gateway alias for single-image instruction edits." }
  - { key: compose_model, label: "Compose model", type: string, description: "Multi-reference alias used for multi-image composition (Qwen-Image-2.1 native multi-ref)." }
  - { key: default_size, label: "Default size", type: string, description: "WxH used when a tool call doesn't specify one." }
  - { key: catalog_timeout_s, label: "Catalog timeout (s)", type: number, description: "Short gateway catalog fetch timeout before using the static schema." }
  - { key: catalog_ttl_s, label: "Catalog cache TTL (s)", type: number, description: "Refresh the gateway catalog after this many seconds; zero disables caching." }
  - { key: timeout_s, label: "Render timeout (s)", type: number, description: "Per-request gateway timeout. ComfyUI queues jobs; slow hosts need headroom." }
  - { key: show_model, label: "Show results to the model", type: bool, description: "Attach generated images to the tool result so a vision model can critique its own output (capped at 2 MiB/image by core)." }
  - { key: studio_retry_on_524, label: "Studio: retry once on gateway timeout", type: bool, description: "When a Studio render returns HTTP 524 (the gateway's ~100s Cloudflare cap), retry it once after a backoff. Off by default: the original ComfyUI job keeps running, so a retry stacks a second GPU job (protoBanana#52)." }
